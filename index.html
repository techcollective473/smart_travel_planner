<!DOCTYPE html>
<html>
<head>
  <title>Travel Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div id="textContainer">
    <div id="text">नमस्ते</div>
  </div>
</div>

<!-- MAIN -->
<section id="attractions">

  <h1 class="title">ATTRACTIONS</h1>
  <p class="subtitle">— worth a thousand stories —</p>

  <button class="nav left" onclick="prev()">&#10094;</button>

  <div class="viewport">
    <div id="cards"></div>
  </div>

  <button class="nav right" onclick="next()">&#10095;</button>
  <button id="discoverBtn" class="discover">Discover more</button>
</section>

<!-- MODAL -->
<div id="modal">
  <div class="modal-content">

    <div class="modal-header">
      <img id="modalImg">
      <h2 id="modalTitle"></h2>
    </div>

    <div class="modal-body">

      <p id="shortDesc"></p>

      <button id="toggleBtn" onclick="toggleDesc()">See More</button>

      <p id="longDesc" style="display:none;"></p>

      <p><b>Nearest Airport:</b> <span id="airport"></span></p>
      <p><b>Nearest Railway Station:</b> <span id="rail"></span></p>

      <p><b>Weather:</b> <span id="weather"></span></p>

      <iframe id="map" width="100%" height="200"></iframe>

      <button onclick="closeModal()">Close</button>

    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
